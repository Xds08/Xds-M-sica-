<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XDS MÚSICA - AO VIVO</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#071b46,#102d69,#b40020);
color:white;
min-height:100vh;
}

header{
background:#071b46;
padding:20px;
text-align:center;
border-bottom:4px solid #e60026;
}

.logo{
font-size:30px;
font-weight:900;
color:white;
}

.logo span{
color:#ff243f;
}

.live{
display:inline-block;
background:#d90025;
padding:6px 15px;
border-radius:20px;
font-size:12px;
margin-top:8px;
}

button{
cursor:pointer;
border:none;
border-radius:10px;
padding:12px;
font-weight:bold;
}

.container{
max-width:1000px;
margin:20px auto;
padding:15px;
display:grid;
grid-template-columns:1.2fr .8fr;
gap:15px;
}

@media(max-width:700px){
.container{grid-template-columns:1fr}
}

.card{
background:#ffffff12;
border:1px solid #ffffff40;
border-radius:18px;
padding:20px;
margin-bottom:15px;
}

.cover{
height:190px;
background:linear-gradient(135deg,#e60026,#ffffff,#123c91);
border-radius:15px;
display:flex;
align-items:center;
justify-content:center;
font-size:65px;
margin-bottom:18px;
}

.song-title{
font-size:21px;
font-weight:bold;
}

.artist{
color:#ddd;
margin:8px 0;
}

audio{
width:100%;
margin:15px 0;
}

.btn-play{
width:100%;
background:#e60026;
color:white;
font-size:18px;
padding:16px;
}

.btn-next{
background:#123c91;
color:white;
width:100%;
margin-top:10px;
}

input{
width:100%;
padding:13px;
margin:7px 0;
border-radius:8px;
border:none;
background:white;
color:#111;
}

.status{
background:#071b46;
padding:12px;
border-radius:10px;
text-align:center;
margin-top:12px;
}

.playlist-item{
background:#071b46;
padding:12px;
border-radius:9px;
margin-top:8px;
display:flex;
justify-content:space-between;
align-items:center;
gap:8px;
}

.owner-only{display:none}
.owner-active .owner-only{display:block}
.owner-active .guest-only{display:none}

.owner-btn{
background:#e60026;
color:white;
}

.modal{
display:none;
position:fixed;
inset:0;
background:#000d;
z-index:100;
align-items:center;
justify-content:center;
}

.modal-box{
background:#071b46;
padding:25px;
width:90%;
max-width:350px;
border-radius:15px;
}

.small-btn{
padding:7px;
background:#e60026;
color:white;
}

</style>
</head>

<body>

<header>
<div class="logo">XDS <span>MÚSICA</span></div>
<div class="live">● RÁDIO ONLINE</div>
<button class="owner-btn" onclick="toggleOwner()">
👑 DONO
</button>
</header>

<div class="container">

<div>

<div class="card">

<div class="cover" id="cover">🎵</div>

<div class="song-title" id="nowTitle">
XDS MÚSICA
</div>

<div class="artist" id="nowArtist">
Escolha uma música para começar
</div>

<audio id="audio" controls playsinline preload="none"></audio>

<button class="btn-play" onclick="playRadio()">
▶️ PLAY / TOCAR RÁDIO
</button>

<button class="btn-next" onclick="nextSong()">
⏭️ PRÓXIMA MÚSICA
</button>

<div class="status" id="status">
⏸️ Rádio parada
</div>

</div>

<div class="card">
<h3>🎶 PLAYLIST</h3>
<div id="playlist"></div>
</div>

<div class="card guest-only">
<h3>🎤 Peça sua música</h3>
<input id="guestName" placeholder="Seu nome">
<input id="guestSong" placeholder="Nome da música">
<button class="btn-play" onclick="sendRequest()">
ENVIAR PEDIDO
</button>
</div>

</div>

<div>

<div class="card">
<h3>📻 Sobre a rádio</h3>
<p style="margin-top:12px">
Bem-vindo à XDS MÚSICA!
Sua companhia musical.
</p>
</div>

<div class="card">
<h3>📋 Pedidos musicais</h3>
<div id="requests">Nenhum pedido ainda.</div>
</div>

<div class="card owner-only">
<h3>👑 PAINEL DO DONO</h3>

<input id="newTitle" placeholder="Nome da música">

<input id="newArtist" placeholder="Artista">

<input id="newUrl" placeholder="Link direto do MP3">

<button class="btn-play" onclick="addSong()">
➕ ADICIONAR MÚSICA
</button>

<button class="btn-next" onclick="logoutOwner()">
SAIR DO PAINEL
</button>

</div>

</div>
</div>

<div class="modal" id="loginModal">
<div class="modal-box">
<h2>👑 PAINEL DO DONO</h2>
<input type="password" id="password" placeholder="Senha do dono">
<button class="btn-play" onclick="login()">ENTRAR</button>
<button class="btn-next" onclick="closeModal()">CANCELAR</button>
</div>
</div>

<script>

const OWNER_PASS="XDS2026";

const audio=document.getElementById("audio");

let playlist=JSON.parse(
localStorage.getItem("xds_playlist")||"[]"
);

let requests=JSON.parse(
localStorage.getItem("xds_requests")||"[]"
);

let currentIdx=0;
let isOwner=false;

function savePlaylist(){
localStorage.setItem(
"xds_playlist",
JSON.stringify(playlist)
);
}

function renderPlaylist(){

const box=document.getElementById("playlist");

if(!playlist.length){
box.innerHTML="<p>Nenhuma música adicionada.</p>";
return;
}

box.innerHTML=playlist.map((song,i)=>`

<div class="playlist-item">

<div onclick="playIndex(${i})" style="cursor:pointer">
${i===currentIdx?"▶️ ":"🎵 "}
${escapeHTML(song.title)}
<br>
<small>${escapeHTML(song.artist||"XDS MÚSICA")}</small>
</div>

${isOwner?`
<button class="small-btn" onclick="removeSong(${i})">X</button>
`:""}

</div>

`).join("");

}

function escapeHTML(value){
return String(value).replace(/[&<>"']/g,c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[c]));
}

async function playRadio(){

if(!playlist.length){
alert("Adicione uma música MP3 no painel do dono!");
return;
}

await playIndex(currentIdx);

}

async function playIndex(index){

if(index<0||index>=playlist.length)return;

currentIdx=index;

const song=playlist[currentIdx];

audio.pause();
audio.src=song.url;
audio.load();

document.getElementById("nowTitle").textContent=song.title;
document.getElementById("nowArtist").textContent=song.artist||"XDS MÚSICA";

document.getElementById("status").textContent="⏳ Carregando música...";

renderPlaylist();

try{

await audio.play();

document.getElementById("status").textContent="🔊 TOCANDO AGORA";

document.getElementById("cover").textContent="🔊";

}catch(error){

document.getElementById("status").textContent="❌ Não foi possível tocar";

alert("Erro ao tocar. Confira o link MP3 e tente novamente.");

}

}

function nextSong(){

if(!playlist.length)return;

currentIdx=(currentIdx+1)%playlist.length;

playIndex(currentIdx);

}

audio.addEventListener("ended",nextSong);

audio.addEventListener("error",()=>{
document.getElementById("status").textContent="❌ Erro no áudio";
});

function addSong(){

const title=document.getElementById("newTitle").value.trim();
const artist=document.getElementById("newArtist").value.trim();
const url=document.getElementById("newUrl").value.trim();

if(!title||!url){
alert("Preencha o nome e o link MP3!");
return;
}

try{

const parsed=new URL(url);

if(parsed.protocol!=="https:"&&parsed.protocol!=="http:"){
alert("Link inválido!");
return;
}

}catch(e){

alert("Digite um link válido!");
return;

}

playlist.push({title,artist,url});

savePlaylist();
renderPlaylist();

document.getElementById("newTitle").value="";
document.getElementById("newArtist").value="";
document.getElementById("newUrl").value="";

alert("Música adicionada!");

}

function removeSong(index){

if(!confirm("Remover esta música?"))return;

if(index===currentIdx){
audio.pause();
audio.removeAttribute("src");
audio.load();
}

playlist.splice(index,1);

if(index<currentIdx)currentIdx--;
if(currentIdx>=playlist.length)currentIdx=0;

savePlaylist();
renderPlaylist();

}

function sendRequest(){

const name=document.getElementById("guestName").value.trim();
const song=document.getElementById("guestSong").value.trim();

if(!name||!song){
alert("Preencha seu nome e a música!");
return;
}

requests.unshift({name,song});

localStorage.setItem(
"xds_requests",
JSON.stringify(requests)
);

renderRequests();

document.getElementById("guestSong").value="";

alert("Pedido enviado!");

}

function renderRequests(){

const box=document.getElementById("requests");

if(!requests.length){
box.textContent="Nenhum pedido ainda.";
return;
}

box.innerHTML=requests.slice(0,20).map(r=>`
<div class="playlist-item">
<div>
<b>${escapeHTML(r.name)}</b><br>
${escapeHTML(r.song)}
</div>
</div>
`).join("");

}

function toggleOwner(){

if(isOwner){
logoutOwner();
return;
}

document.getElementById("loginModal").style.display="flex";

}

function closeModal(){
document.getElementById("loginModal").style.display="none";
}

function login(){

if(document.getElementById("password").value===OWNER_PASS){

isOwner=true;

document.body.classList.add("owner-active");

closeModal();

renderPlaylist();

}else{

alert("Senha incorreta!");

}

document.getElementById("password").value="";

}

function logoutOwner(){

isOwner=false;

document.body.classList.remove("owner-active");

renderPlaylist();

}

renderPlaylist();
renderRequests();

</script>

</body>
</html>
