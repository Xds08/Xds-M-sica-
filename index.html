<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XDS MÚSICA - Rádio 24h</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:linear-gradient(135deg,#0f0f0f,#3a0a5c);color:#fff;min-height:100vh}
header{background:rgba(0,0,0,0.7);padding:15px;text-align:center;border-bottom:3px solid #ff00ff;position:sticky;top:0;z-index:100}
.logo{font-size:28px;font-weight:900;color:#ff00ff;text-shadow:0 0 10px #ff00ff}
.live{color:#0f0;background:#003300;padding:3px 10px;border-radius:20px;font-size:12px;margin-left:10px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:0.3}}
.container{max-width:900px;margin:20px auto;padding:15px;display:grid;grid-template-columns:1fr 320px;gap:15px}
@media(max-width:700px){.container{grid-template-columns:1fr}}
.player-card,.request-card,.owner-card{background:rgba(255,255,255,0.07);backdrop-filter:blur(10px);border-radius:15px;padding:20px;border:1px solid rgba(255,0,255,0.3)}
.cover{width:100%;height:200px;background:linear-gradient(45deg,#ff00ff,#00ffff);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:80px;margin-bottom:15px}
.song-title{font-size:22px;font-weight:bold}
.artist{color:#ccc;margin-bottom:15px}
.btn{padding:12px 20px;border:none;border-radius:25px;font-weight:bold;cursor:pointer}
.btn-play{background:#ff00ff;color:#fff;width:100%;font-size:18px}
.btn-owner{background:#333;color:#fff;font-size:12px;position:absolute;right:15px;top:15px}
.btn-exit{background:#ff3333;color:#fff;margin-top:10px;width:100%}
input{width:100%;padding:12px;border-radius:8px;border:none;margin:8px 0;background:#222;color:#fff}
.listeners{background:#111;padding:10px;border-radius:8px;text-align:center;margin:10px 0}
.owner-only{display:none}
.owner-active .owner-only{display:block}
.owner-active .guest-only{display:none}
.playlist-item{padding:8px;background:rgba(0,0,0,0.3);margin:5px 0;border-radius:5px;display:flex;justify-content:space-between;align-items:center}
.status{padding:10px;background:#111;border-radius:8px;margin:10px 0;text-align:center;font-size:13px;color:#0f0}
</style>
</head>
<body>
<header>
<span class="logo">XDS MÚSICA</span><span class="live">● AO VIVO 24H</span>
<button class="btn btn-owner" id="ownerBtn" onclick="toggleOwner()">👑 DONO</button>
</header>
<div class="container">
<div>
<div class="player-card">
<div class="cover">🎵</div>
<div class="song-title" id="nowTitle">Clique em PLAY para começar</div>
<div class="artist" id="nowArtist">Rádio XDS MÚSICA</div>
<audio id="audioPlayer" controls style="width:100%;margin:10px 0"></audio>
<button class="btn btn-play" onclick="playRadio()">▶️ TOCAR RÁDIO</button>
<div class="listeners">👥 <span id="listenerCount">1</span> ouvintes online</div>
<div class="status" id="statusMsg">Rádio pronta! Seus amigos já podem ouvir sem senha.</div>
<div id="queueList" style="margin-top:15px"></div>
</div>
</div>
<div>
<div class="request-card guest-only">
<h3>🎤 Peça sua música</h3>
<input type="text" id="reqName" placeholder="Seu nome">
<input type="text" id="reqSong" placeholder="Música - Artista">
<button class="btn btn-play" onclick="requestSong()">ENVIAR PEDIDO</button>
<p style="font-size:11px;color:#aaa;margin-top:10px">Você não precisa de senha!</p>
</div>
<div class="request-card">
<h3>📋 Pedidos</h3>
<div id="requestList"><p style="color:#888">Nenhum pedido</p></div>
</div>
<div class="owner-card owner-only" style="margin-top:15px;border:2px solid #0f0">
<h3>👑 PAINEL DO DONO</h3>
<p style="font-size:12px;color:#0f0">Só você vê isso</p>
<input type="text" id="addSongTitle" placeholder="Add música">
<input type="text" id="addSongUrl" placeholder="Link MP3 (opcional)">
<button class="btn btn-play" onclick="addToPlaylist()" style="background:#0a0">+ ADD NA PLAYLIST</button>
<div id="ownerRequests" style="margin-top:10px"></div>
<button class="btn btn-exit" onclick="logoutOwner()">SAIR DO MODO DONO</button>
</div>
</div>
</div>
<div id="loginModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:999;align-items:center;justify-content:center">
<div style="background:#222;padding:30px;border-radius:15px;width:90%;max-width:350px;text-align:center;border:2px solid #ff00ff">
<h2>👑 Área do Dono</h2>
<input type="password" id="ownerPass" placeholder="Senha">
<button class="btn btn-play" onclick="loginOwner()">ENTRAR</button>
<button class="btn" onclick="closeModal()" style="background:#333;color:#fff;width:100%;margin-top:10px">CANCELAR</button>
<p style="font-size:11px;margin-top:10px;color:#666">Senha: XDS2024</p>
</div>
</div>
<script>
const OWNER_PASSWORD="XDS2024";
let isOwner=false;
let requests=JSON.parse(localStorage.getItem('xds_requests')||'[]');
let playlist=JSON.parse(localStorage.getItem('xds_playlist')||'null') || [
{title:"XDS MÚSICA - Abertura",artist:"Rádio 24h",url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"},
{title:"Batidão do XDS",artist:"XDS",url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"},
{title:"Festa na Caucaia",artist:"XDS",url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"}
];
let currentIndex=0;
const audio=document.getElementById('audioPlayer');
function playRadio(){
if(playlist.length===0)return;
audio.src=playlist[currentIndex].url;
audio.play();
document.getElementById('nowTitle').innerText=playlist[currentIndex].title;
document.getElementById('nowArtist').innerText=playlist[currentIndex].artist;
document.getElementById('statusMsg').innerText="🔊 Tocando ao vivo!";
updateQueue();
}
audio.onended=()=>{currentIndex=(currentIndex+1)%playlist.length;playRadio();};
function requestSong(){
const name=document.getElementById('reqName').value.trim();
const song=document.getElementById('reqSong').value.trim();
if(!name||!song){alert("Preencha nome e música!");return;}
requests.push({name,song,time:new Date().toLocaleTimeString(),id:Date.now()});
localStorage.setItem('xds_requests',JSON.stringify(requests));
document.getElementById('reqSong').value="";
renderRequests();
alert("✅ Pedido enviado!");
}
function renderRequests(){
const list=document.getElementById('requestList');
const ownerList=document.getElementById('ownerRequests');
if(requests.length===0){list.innerHTML='<p style="color:#888">Nenhum pedido</p>';if(ownerList)ownerList.innerHTML='';return;}
list.innerHTML=requests.map(r=>`<div class="playlist-item"><span><b>${r.name}</b><br><small>${r.song}</small></span><small>${r.time}</small></div>`).join('');
if(isOwner&&ownerList){
ownerList.innerHTML='<h4>Pedidos para aprovar:</h4>'+requests.map(r=>`<div class="playlist-item"><span>${r.name} - ${r.song}</span><button onclick="approveReq(${r.id})" style="background:#0a0;color:#fff;border:none;padding:5px 10px;border-radius:5px">TOCAR</button> <button onclick="removeReq(${r.id})" style="background:#a00;color:#fff;border:none;padding:5px;border-radius:5px">X</button></div>`).join('');
}
}
function approveReq(id){const req=requests.find(r=>r.id===id);if(!req)return;playlist.push({title:req.song,artist:"Pedido de "+req.name,url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3"});localStorage.setItem('xds_play
